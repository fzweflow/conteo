<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conteo</title>
<meta name="description" content="Cuenta inventario con un botón grande: total, contados, restantes y cuánto suma cada pulsación.">
<!--%%APP%%-->
<style>
/* ---------- colores ----------
   Los mismos valores están en paletas.json y el build verifica el contraste.
   Si cambias uno aquí, cámbialo allá.                                      */
:root{
  --fondo:#F3F5F3; --panel:#FFFFFF; --tinta:#131A18; --suave:#55605D;
  --borde:#D3D9D6; --acento:#0B6E58; --sobre-acento:#FFFFFF; --exceso:#9C3714;
  --sombra:0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --fondo:#0E1311; --panel:#171E1B; --tinta:#E9EEEB; --suave:#9FABA7;
    --borde:#2B3531; --acento:#3DBB9B; --sobre-acento:#04140F; --exceso:#FF9166;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* una pantalla a la vez */
.pantalla{display:none; min-height:100vh; min-height:100dvh; flex-direction:column;
  padding:max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  gap:14px; max-width:560px; margin:0 auto}
body[data-pantalla="preparar"] #preparar,
body[data-pantalla="contar"]   #contar,
body[data-pantalla="historial"] #historial{display:flex}

/* ---------- barra superior ---------- */
.barra{display:flex; align-items:center; gap:10px; min-height:44px}
.barra h1{font-size:19px; margin:0; font-weight:650; letter-spacing:-.01em}
.barra .crece{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:650}
.icono{border:1px solid var(--borde); background:var(--panel); border-radius:12px;
  min-width:44px; height:44px; display:grid; place-items:center; font-size:15px; padding:0 12px; font-weight:600}
.icono:active{transform:scale(.96)}

/* ---------- formulario ---------- */
.campo{display:flex; flex-direction:column; gap:7px}
.campo label{font-size:13px; color:var(--suave); font-weight:600; letter-spacing:.01em}
.campo input{background:var(--panel); border:1px solid var(--borde); border-radius:14px;
  padding:14px 16px; font-size:17px; width:100%; outline:none}
.campo input:focus{border-color:var(--acento); box-shadow:0 0 0 3px color-mix(in srgb, var(--acento) 22%, transparent)}
#total{font-size:30px; font-weight:650; letter-spacing:-.02em; padding:16px}
.pista{font-size:13px; color:var(--suave); margin:0; line-height:1.45}

/* ---------- fichas de paso ---------- */
.pasos{display:flex; flex-wrap:wrap; gap:8px}
.ficha{border:1px solid var(--borde); background:var(--panel); border-radius:999px;
  padding:10px 15px; font-size:15px; font-weight:600; min-height:44px}
.ficha[aria-pressed="true"]{background:var(--acento); color:var(--sobre-acento); border-color:var(--acento)}
#otroPaso{width:96px; padding:10px 14px; border-radius:999px; text-align:center; font-weight:600;
  background:var(--panel); border:1px solid var(--borde); min-height:44px; outline:none}

/* ---------- botón principal ---------- */
.principal{border:none; border-radius:16px; background:var(--acento); color:var(--sobre-acento);
  padding:17px; font-size:17px; font-weight:650; width:100%}
.principal:disabled{opacity:.4}
.principal:active:not(:disabled){transform:scale(.99)}

/* ---------- marcador ---------- */
.marcador{text-align:center}
.contado{font-size:clamp(56px, 20vw, 104px); font-weight:700; line-height:1; letter-spacing:-.03em}
.deTotal{font-size:15px; color:var(--suave); margin-top:6px; min-height:20px}
.deTotal b{color:var(--tinta); font-weight:650}
.barraProg{height:8px; border-radius:99px; background:var(--borde); overflow:hidden; margin-top:12px}
.barraProg span{display:block; height:100%; width:0; background:var(--acento);
  transition:width .18s ease; border-radius:99px}
body.completo .contado{color:var(--acento)}
body.exceso  .contado{color:var(--exceso)}
body.exceso  .barraProg span{background:var(--exceso)}
.estadoConteo{font-size:14px; font-weight:650; margin-top:10px; min-height:19px}
body.completo .estadoConteo{color:var(--acento)}
body.exceso   .estadoConteo{color:var(--exceso)}

/* ---------- el botón de contar: la mitad de la pantalla ----------
   Un círculo lo limita el ancho del teléfono y se queda en un cuarto de la
   pantalla; este rectángulo redondeado llena la zona central entera, que en
   un teléfono típico es alrededor del 45-50% del alto.                     */
.zona{flex:1; display:flex; min-height:180px}
#contador{
  flex:1; width:100%; border-radius:34px;
  border:none; background:var(--acento); color:var(--sobre-acento);
  display:grid; place-items:center; align-content:center; gap:4px; line-height:1;
  box-shadow:var(--sombra); touch-action:manipulation; user-select:none; -webkit-user-select:none;
  transition:transform .07s ease, background .2s ease;
}
#contador .mas{font-size:clamp(40px, 13vw, 66px); font-weight:700; letter-spacing:-.02em}
#contador .cada{font-size:13px; opacity:.85; font-weight:600}
#contador:active{transform:scale(.965)}
body.completo #contador{background:color-mix(in srgb, var(--acento) 84%, var(--tinta))}
body.exceso  #contador{background:var(--exceso)}

/* ---------- fila inferior ---------- */
.fila{display:flex; gap:8px}
.fila button{flex:1; min-height:52px; border-radius:14px; border:1px solid var(--borde);
  background:var(--panel); font-size:15px; font-weight:600}
.fila button:disabled{opacity:.35}
.fila button:active:not(:disabled){transform:scale(.98)}
#terminar{background:var(--acento); color:var(--sobre-acento); border-color:var(--acento)}

/* ---------- hojas (ajustes y resumen) ---------- */
.hoja{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
  align-items:flex-end; justify-content:center; z-index:9}
.hoja[data-abierta="1"]{display:flex}
.hoja > div{background:var(--panel); border-radius:22px 22px 0 0; width:100%; max-width:560px;
  padding:20px 18px max(20px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px;
  max-height:92vh; overflow:auto}
.hoja h2{margin:0; font-size:18px}
.opcion{display:flex; align-items:center; gap:12px; justify-content:space-between;
  padding:12px 0; border-bottom:1px solid var(--borde)}
.opcion p{margin:2px 0 0; font-size:13px; color:var(--suave); line-height:1.4}
.opcion input{width:24px; height:24px; accent-color:var(--acento); flex:none}
.opcion .txt{font-size:15px; font-weight:600}

/* ---------- resumen y historial ---------- */
.cifras{display:flex; gap:10px; text-align:center}
.cifras div{flex:1; background:var(--fondo); border:1px solid var(--borde); border-radius:14px; padding:12px 6px}
.cifras strong{display:block; font-size:24px; letter-spacing:-.02em}
.cifras small{color:var(--suave); font-size:12px}
.lista{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;
  overflow:auto; flex:1}
.lista li{background:var(--panel); border:1px solid var(--borde); border-radius:14px;
  padding:12px 14px; display:flex; align-items:center; gap:10px}
.lista .nom{font-weight:650; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lista .sub{font-size:13px; color:var(--suave); margin-top:3px}
.dif{font-size:13px; font-weight:700; padding:5px 10px; border-radius:999px;
  border:1px solid var(--borde); white-space:nowrap}
.dif.ok{color:var(--acento); border-color:color-mix(in srgb, var(--acento) 45%, var(--borde))}
.dif.mal{color:var(--exceso); border-color:color-mix(in srgb, var(--exceso) 45%, var(--borde))}
.vacio{color:var(--suave); font-size:14px; text-align:center; padding:40px 20px; line-height:1.5}
.secundario{background:none; border:none; color:var(--acento); font-weight:650; font-size:15px; padding:12px}
</style>
</head>
<body data-pantalla="preparar">

<!-- ============ 1. preparar ============ -->
<section class="pantalla" id="preparar">
  <div class="barra">
    <h1 class="crece">Conteo</h1>
    <button class="icono" id="verHistorial" type="button">Historial</button>
  </div>

  <div class="campo">
    <label for="nombre">Qué estás contando <span style="font-weight:400">(opcional)</span></label>
    <input id="nombre" type="text" placeholder="Ej: Interruptores 2P 25A" autocomplete="off" enterkeyhint="next">
  </div>

  <div class="campo">
    <label for="total">Total a contar</label>
    <input id="total" type="number" inputmode="numeric" min="1" max="999999" placeholder="0" enterkeyhint="go">
  </div>

  <div class="campo">
    <label>Cada pulsación suma</label>
    <div class="pasos" id="pasosPreparar"></div>
  </div>

  <p class="pista" id="pistaSeguir" hidden></p>
  <div style="flex:1"></div>
  <button class="principal" id="empezar" type="button" disabled>Empezar a contar</button>
</section>

<!-- ============ 2. contar ============ -->
<section class="pantalla" id="contar">
  <div class="barra">
    <span class="crece" id="tituloConteo"></span>
    <button class="icono" id="verAjustes" type="button" aria-label="Ajustes">Ajustes</button>
  </div>

  <div class="marcador">
    <div class="contado num" id="contado">0</div>
    <div class="deTotal num" id="deTotal"></div>
    <div class="barraProg" id="cajaBarra"><span id="barra"></span></div>
    <div class="estadoConteo" id="estadoConteo"></div>
  </div>

  <div class="zona">
    <button id="contador" type="button" aria-label="Contar">
      <span class="mas num" id="masPaso">+1</span>
      <span class="cada" id="cada">toca para contar</span>
    </button>
  </div>

  <div class="pasos" id="pasosContar"></div>

  <div class="fila">
    <button id="deshacer" type="button">Deshacer</button>
    <button id="restar" type="button" class="num">&minus;1</button>
    <button id="terminar" type="button">Terminar</button>
  </div>
</section>

<!-- ============ 3. historial ============ -->
<section class="pantalla" id="historial">
  <div class="barra">
    <button class="icono" id="volverDeHistorial" type="button" aria-label="Volver">&larr;</button>
    <h1 class="crece">Historial</h1>
    <button class="icono" id="copiarTodo" type="button">Copiar</button>
  </div>
  <ul class="lista" id="listaHistorial"></ul>
  <button class="secundario" id="borrarTodo" type="button">Borrar historial</button>
</section>

<!-- ============ hoja: ajustes ============ -->
<div class="hoja" id="hojaAjustes">
  <div>
    <h2>Ajustes</h2>
    <label class="opcion"><span><span class="txt">Vibración</span><p>Un toque corto en cada pulsación.</p></span>
      <input type="checkbox" id="ajVib"></label>
    <label class="opcion"><span><span class="txt">Sonido</span><p>Un clic corto, distinto al completar.</p></span>
      <input type="checkbox" id="ajSon"></label>
    <label class="opcion"><span><span class="txt">Conteo a ciegas</span><p>Esconde el total y lo que falta hasta terminar. Contar sabiendo la cifra esperada empuja a cuadrarla.</p></span>
      <input type="checkbox" id="ajCiego"></label>
    <label class="opcion"><span><span class="txt">Pantalla siempre encendida</span><p>Mientras estás contando.</p></span>
      <input type="checkbox" id="ajPantalla"></label>
    <button class="principal" id="cerrarAjustes" type="button">Listo</button>
    <button class="secundario" id="cancelarConteo" type="button">Descartar este conteo</button>
  </div>
</div>

<!-- ============ hoja: resumen al terminar ============ -->
<div class="hoja" id="hojaResumen">
  <div>
    <h2 id="tituloResumen">Resumen</h2>
    <div class="cifras">
      <div><strong class="num" id="rContado">0</strong><small>contado</small></div>
      <div><strong class="num" id="rTotal">0</strong><small>esperado</small></div>
      <div><strong class="num" id="rDif">0</strong><small>diferencia</small></div>
    </div>
    <p class="pista" id="textoResumen"></p>
    <button class="principal" id="guardarConteo" type="button">Guardar y empezar otro</button>
    <button class="secundario" id="seguirContando" type="button">Seguir contando</button>
  </div>
</div>

<script>
(function(){
"use strict";

var CLAVE = "conteo.v1";
var PASOS_BASE = [1, 6, 12, 24];

/* ---------- estado ---------- */
var est = {
  ajustes:{ vib:true, son:true, ciego:false, pantalla:true },
  pasoPersonal:null,
  actual:null,      /* {nombre,total,paso,contado,pila,inicio} */
  historial:[]
};
try{
  var crudo = localStorage.getItem(CLAVE);
  if(crudo){
    var g = JSON.parse(crudo);
    if(g && typeof g === "object"){
      est.ajustes = Object.assign(est.ajustes, g.ajustes || {});
      est.pasoPersonal = g.pasoPersonal || null;
      est.actual = g.actual || null;
      est.historial = Array.isArray(g.historial) ? g.historial : [];
    }
  }
}catch(e){ /* almacenamiento bloqueado: la app funciona igual, sin recordar */ }

function guardar(){
  try{ localStorage.setItem(CLAVE, JSON.stringify(est)); }catch(e){}
}

function $(id){ return document.getElementById(id); }
var pasoElegido = 1;

/* ---------- sonido y vibración ---------- */
var audio = null;
function tono(hz, dur, vol){
  if(!est.ajustes.son) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audio) audio = new AC();
    if(audio.state === "suspended") audio.resume();
    var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = "triangle"; o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
function vibrar(patron){
  if(!est.ajustes.vib) return;
  try{ if(navigator.vibrate) navigator.vibrate(patron); }catch(e){}
}

/* ---------- pantalla encendida ---------- */
var candado = null;
function pedirPantalla(){
  if(!est.ajustes.pantalla || !navigator.wakeLock) return;
  if(document.body.dataset.pantalla !== "contar") return;
  if(document.visibilityState !== "visible") return;
  navigator.wakeLock.request("screen").then(function(c){ candado = c; }).catch(function(){});
}
function soltarPantalla(){
  if(candado){ try{ candado.release(); }catch(e){} candado = null; }
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") pedirPantalla(); else soltarPantalla();
});

/* ---------- fichas de paso ---------- */
function listaPasos(){
  var p = PASOS_BASE.slice();
  if(est.pasoPersonal && p.indexOf(est.pasoPersonal) < 0) p.push(est.pasoPersonal);
  if(pasoElegido && p.indexOf(pasoElegido) < 0) p.push(pasoElegido);
  p.sort(function(a,b){ return a-b; });
  return p;
}
function pintarPasos(){
  [["pasosPreparar", true], ["pasosContar", false]].forEach(function(par){
    var caja = $(par[0]);
    if(!caja) return;
    caja.innerHTML = "";
    listaPasos().forEach(function(n){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "ficha num";
      b.textContent = "+" + n;
      b.setAttribute("aria-pressed", n === pasoElegido ? "true" : "false");
      b.addEventListener("click", function(){ elegirPaso(n); });
      caja.appendChild(b);
    });
    if(par[1]){
      var inp = document.createElement("input");
      inp.type = "number"; inp.inputMode = "numeric"; inp.min = "1"; inp.max = "9999";
      inp.id = "otroPaso"; inp.placeholder = "otro";
      inp.setAttribute("aria-label", "Otro valor por pulsación");
      inp.addEventListener("change", function(){
        var n = Math.floor(Number(inp.value));
        inp.value = "";
        if(n > 0 && n <= 9999){ est.pasoPersonal = n; elegirPaso(n); }
      });
      caja.appendChild(inp);
    }
  });
}
function elegirPaso(n){
  pasoElegido = n;
  if(est.actual) est.actual.paso = n;
  guardar();
  pintarPasos();
  pintarConteo();
}

/* ---------- pintar ---------- */
function irA(p){
  document.body.dataset.pantalla = p;
  if(p === "contar") pedirPantalla(); else soltarPantalla();
  window.scrollTo(0, 0);
}

function pintarConteo(){
  $("masPaso").textContent = "+" + pasoElegido;
  $("restar").innerHTML = "&minus;" + pasoElegido;
  var a = est.actual;
  if(!a) return;

  var falta = a.total - a.contado;
  $("contado").textContent = a.contado;
  $("tituloConteo").textContent = a.nombre || "Sin nombre";
  $("deshacer").disabled = !a.pila.length;
  $("restar").disabled = a.contado <= 0;
  $("cada").textContent = a.contado === 0 ? "toca para contar" : "por pulsación";

  var ciego = est.ajustes.ciego;
  $("deTotal").innerHTML = ciego ? "conteo a ciegas"
    : (falta > 0 ? "faltan <b>" + falta + "</b> de " + a.total
                 : "de " + a.total + " esperados");
  $("cajaBarra").style.visibility = ciego ? "hidden" : "visible";
  $("barra").style.width = Math.min(a.contado / Math.max(a.total, 1), 1) * 100 + "%";

  document.body.classList.toggle("completo", !ciego && falta === 0);
  document.body.classList.toggle("exceso",   !ciego && falta < 0);
  $("estadoConteo").textContent = ciego ? ""
    : (falta === 0 ? "Completo" : (falta < 0 ? (-falta) + " de más" : ""));
}

/* ---------- contar ---------- */
function aplicar(delta){
  var a = est.actual;
  if(!a) return;
  var antes = a.contado;
  a.contado = Math.max(0, a.contado + delta);
  if(a.contado === antes) return;
  a.pila.push(a.contado - antes);
  if(a.pila.length > 500) a.pila.shift();
  var completo = !est.ajustes.ciego && a.contado === a.total && delta > 0;
  if(completo){
    vibrar([26,60,26]); tono(760, 0.10, 0.09);
    setTimeout(function(){ tono(1140, 0.12, 0.09); }, 95);
  }else if(delta > 0){
    vibrar(11); tono(880, 0.035, 0.06);
  }else{
    vibrar(18); tono(420, 0.05, 0.05);
  }
  guardar();
  pintarConteo();
}
function deshacer(){
  var a = est.actual;
  if(!a || !a.pila.length) return;
  a.contado = Math.max(0, a.contado - a.pila.pop());
  vibrar(18); tono(360, 0.05, 0.05);
  guardar();
  pintarConteo();
}

/* el pointerdown cuenta en el instante del toque; con click se siente lento */
var contadorBtn = $("contador");
contadorBtn.addEventListener("pointerdown", function(ev){ ev.preventDefault(); aplicar(pasoElegido); });
contadorBtn.addEventListener("contextmenu", function(ev){ ev.preventDefault(); });

$("restar").addEventListener("click", function(){ aplicar(-pasoElegido); });
$("deshacer").addEventListener("click", deshacer);

document.addEventListener("keydown", function(ev){
  if(document.body.dataset.pantalla !== "contar") return;
  if(document.querySelector('.hoja[data-abierta="1"]')) return;
  var t = ev.target.tagName;
  if(t === "INPUT" || t === "TEXTAREA") return;
  if(ev.code === "Space" || ev.code === "Enter" || ev.code === "NumpadEnter"){
    ev.preventDefault(); aplicar(pasoElegido);
  }else if(ev.code === "Backspace"){
    ev.preventDefault(); deshacer();
  }
});

/* ---------- preparar ---------- */
function revisarEmpezar(){
  var n = Math.floor(Number($("total").value));
  $("empezar").disabled = !(n > 0 && n <= 999999);
}
function empezar(){
  var total = Math.floor(Number($("total").value));
  if(!(total > 0)) return;
  est.actual = {
    nombre: $("nombre").value.trim(),
    total: total,
    paso: pasoElegido,
    contado: 0,
    pila: [],
    inicio: Date.now()
  };
  guardar();
  pintarConteo();
  irA("contar");
}
$("total").addEventListener("input", revisarEmpezar);
$("total").addEventListener("keydown", function(ev){
  if(ev.key === "Enter" && !$("empezar").disabled) empezar();
});
$("empezar").addEventListener("click", empezar);

/* ---------- hojas ---------- */
function abrir(h){ $(h).dataset.abierta = "1"; }
function cerrar(h){ $(h).dataset.abierta = "0"; }
Array.prototype.forEach.call(document.querySelectorAll(".hoja"), function(h){
  h.addEventListener("click", function(ev){ if(ev.target === h) h.dataset.abierta = "0"; });
});

/* ---------- terminar ---------- */
$("terminar").addEventListener("click", function(){
  var a = est.actual;
  if(!a) return;
  var dif = a.contado - a.total;
  $("rContado").textContent = a.contado;
  $("rTotal").textContent = a.total;
  $("rDif").textContent = (dif > 0 ? "+" : "") + dif;
  $("rDif").style.color = dif === 0 ? "var(--acento)" : "var(--exceso)";
  $("tituloResumen").textContent = a.nombre || "Conteo sin nombre";
  $("textoResumen").textContent = dif === 0
    ? "Cuadra con lo esperado."
    : (dif > 0 ? "Hay " + dif + " de más de lo esperado."
               : "Faltan " + (-dif) + " para lo esperado.");
  abrir("hojaResumen");
});
$("seguirContando").addEventListener("click", function(){ cerrar("hojaResumen"); });
$("guardarConteo").addEventListener("click", function(){
  var a = est.actual;
  if(a){
    est.historial.unshift({
      nombre: a.nombre, total: a.total, contado: a.contado,
      paso: a.paso, inicio: a.inicio, fin: Date.now()
    });
    if(est.historial.length > 200) est.historial.length = 200;
  }
  est.actual = null;
  guardar();
  cerrar("hojaResumen");
  $("total").value = ""; $("nombre").value = "";
  $("pistaSeguir").hidden = true;
  revisarEmpezar();
  document.body.classList.remove("completo", "exceso");
  pintarHistorial();
  irA("preparar");
});

/* ---------- ajustes ---------- */
function pintarAjustes(){
  $("ajVib").checked = est.ajustes.vib;
  $("ajSon").checked = est.ajustes.son;
  $("ajCiego").checked = est.ajustes.ciego;
  $("ajPantalla").checked = est.ajustes.pantalla;
}
[["ajVib","vib"], ["ajSon","son"], ["ajCiego","ciego"], ["ajPantalla","pantalla"]].forEach(function(par){
  $(par[0]).addEventListener("change", function(){
    est.ajustes[par[1]] = $(par[0]).checked;
    guardar();
    if(par[1] === "pantalla"){ if(est.ajustes.pantalla) pedirPantalla(); else soltarPantalla(); }
    pintarConteo();
  });
});
$("verAjustes").addEventListener("click", function(){ pintarAjustes(); abrir("hojaAjustes"); });
$("cerrarAjustes").addEventListener("click", function(){ cerrar("hojaAjustes"); });
$("cancelarConteo").addEventListener("click", function(){
  if(!confirm("¿Descartar este conteo sin guardarlo?")) return;
  est.actual = null;
  guardar();
  cerrar("hojaAjustes");
  $("pistaSeguir").hidden = true;
  document.body.classList.remove("completo", "exceso");
  irA("preparar");
});

/* ---------- historial ---------- */
function fechaCorta(ms){
  var d = new Date(ms);
  return d.toLocaleDateString("es-CL", {day:"2-digit", month:"2-digit"}) + " " +
         d.toLocaleTimeString("es-CL", {hour:"2-digit", minute:"2-digit"});
}
function pintarHistorial(){
  var ul = $("listaHistorial");
  ul.innerHTML = "";
  if(!est.historial.length){
    var li = document.createElement("li");
    li.className = "vacio";
    li.style.background = "none"; li.style.border = "none"; li.style.display = "block";
    li.textContent = "Todavía no hay conteos guardados.";
    ul.appendChild(li);
    return;
  }
  est.historial.forEach(function(h){
    var dif = h.contado - h.total;
    var li = document.createElement("li");

    var izq = document.createElement("div");
    izq.style.flex = "1"; izq.style.minWidth = "0";
    var nom = document.createElement("div");
    nom.className = "nom";
    nom.textContent = h.nombre || "Sin nombre";
    var sub = document.createElement("div");
    sub.className = "sub num";
    sub.textContent = h.contado + " de " + h.total + " · " + fechaCorta(h.fin);
    izq.appendChild(nom); izq.appendChild(sub);

    var marca = document.createElement("span");
    marca.className = "dif num " + (dif === 0 ? "ok" : "mal");
    marca.textContent = dif === 0 ? "cuadra" : (dif > 0 ? "+" + dif : String(dif));

    var rep = document.createElement("button");
    rep.className = "icono"; rep.type = "button"; rep.textContent = "↻";
    rep.setAttribute("aria-label", "Repetir este conteo");
    rep.addEventListener("click", function(){
      $("nombre").value = h.nombre || "";
      $("total").value = h.total;
      elegirPaso(h.paso || 1);
      revisarEmpezar();
      irA("preparar");
    });

    li.appendChild(izq); li.appendChild(marca); li.appendChild(rep);
    ul.appendChild(li);
  });
}
$("verHistorial").addEventListener("click", function(){ pintarHistorial(); irA("historial"); });
$("volverDeHistorial").addEventListener("click", function(){ irA(est.actual ? "contar" : "preparar"); });
$("copiarTodo").addEventListener("click", function(){
  if(!est.historial.length) return;
  var txt = "Fecha\tQué\tEsperado\tContado\tDiferencia\n" + est.historial.map(function(h){
    return fechaCorta(h.fin) + "\t" + (h.nombre || "Sin nombre") + "\t" + h.total + "\t" +
           h.contado + "\t" + (h.contado - h.total);
  }).join("\n");
  var listo = function(){
    $("copiarTodo").textContent = "Copiado";
    setTimeout(function(){ $("copiarTodo").textContent = "Copiar"; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(listo).catch(function(){});
  }else{
    var ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); listo(); }catch(e){}
    document.body.removeChild(ta);
  }
});
$("borrarTodo").addEventListener("click", function(){
  if(!est.historial.length) return;
  if(!confirm("¿Borrar los " + est.historial.length + " conteos guardados?")) return;
  est.historial = [];
  guardar();
  pintarHistorial();
});

/* ---------- arranque ---------- */
pasoElegido = (est.actual && est.actual.paso) || 1;
pintarPasos();
pintarAjustes();
pintarHistorial();
pintarConteo();
if(est.actual){
  $("pistaSeguir").hidden = false;
  $("pistaSeguir").textContent = "Tenías un conteo sin terminar y sigue abierto.";
  irA("contar");
}else{
  irA("preparar");
}
})();
</script>
</body>
</html>
